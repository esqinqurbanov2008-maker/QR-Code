<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Free QR Code Generator</title>
  <meta name="description" content="Create and download QR codes for free.">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      color: #666;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 5px;
    }

    #qrcode {
      margin: 25px auto;
      display: flex;
      justify-content: center;
    }

    #download {
      display: none;
      background: #2d7d46;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>📱 QR Code Generator</h1>

    <p>Create a QR code from a link or text</p>

    <input
      id="text"
      type="text"
      placeholder="Enter a link or text..."
    >

    <button onclick="createQR()">
      GENERATE QR CODE
    </button>

    <div id="qrcode"></div>

    <button id="download" onclick="downloadQR()">
      DOWNLOAD QR CODE
    </button>

  </div>

  <script>

    function createQR() {

      const text = document.getElementById("text").value.trim();
      const qr = document.getElementById("qrcode");
      const downloadButton = document.getElementById("download");

      qr.innerHTML = "";
      downloadButton.style.display = "none";

      if (text === "") {
        alert("Please enter a link or text!");
        return;
      }

      new QRCode(qr, {
        text: text,
        width: 250,
        height: 250,
        correctLevel: QRCode.CorrectLevel.H
      });

      downloadButton.style.display = "block";
    }

    function downloadQR() {

      const canvas = document.querySelector("#qrcode canvas");

      if (!canvas) {
        alert("Please generate a QR code first!");
        return;
      }

      const image = canvas.toDataURL("image/png");

      const newWindow = window.open();

      if (newWindow) {

        newWindow.document.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>QR Code</title>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
          </head>

          <body style="
            margin:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f2f2f2;
          ">

            <img
              src="${image}"
              style="width:90%;max-width:500px;"
            >

          </body>
          </html>
        `);

        newWindow.document.close();

      } else {

        alert("Please allow pop-ups for this website.");

      }
    }

  </script>

</body>
</html>
