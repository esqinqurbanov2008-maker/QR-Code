<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Free QR Code Generator</title>
  <meta name="description" content="Create free QR codes instantly from links or text. Simple, fast and easy to use.">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: white;
      width: 90%;
      max-width: 400px;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #qrcode {
      margin: 25px auto;
      display: flex;
      justify-content: center;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>📱 QR Code Generator</h1>

    <p>Create a QR code from a link or text</p>

    <input
      id="text"
      type="text"
      placeholder="Enter a link or text..."
    >

    <button onclick="createQR()">GENERATE QR CODE</button>

    <div id="qrcode"></div>
  </div>

  <script>
    function createQR() {
      const text = document.getElementById("text").value;
      const qr = document.getElementById("qrcode");

      qr.innerHTML = "";

      if (text.trim() === "") {
        alert("Please enter a link or text!");
        return;
      }

      new QRCode(qr, {
        text: text,
        width: 220,
        height: 220
      });
    }
  </script>

</body>
</html>
